---
# kube-proxy tries to set nf_conntrack_max via /proc/sys which is read-only in containers.
# Patch its ConfigMap to set conntrack.maxPerCore=0 so it skips that tuning.
- name: Patch kube-proxy to skip conntrack tuning (container-safe)
  ansible.builtin.shell: |
    kubectl -n kube-system get configmap kube-proxy -o yaml | \
    sed 's/maxPerCore: null/maxPerCore: 0/' | \
    kubectl apply -f -
  environment:
    KUBECONFIG: /root/.kube/config
  register: kube_proxy_patch
  failed_when: false
  changed_when: "'configured' in kube_proxy_patch.stdout"

- name: Restart kube-proxy after patch
  ansible.builtin.shell: |
    kubectl -n kube-system rollout restart daemonset/kube-proxy
  environment:
    KUBECONFIG: /root/.kube/config
  failed_when: false
  changed_when: false

- name: Wait for kube-apiserver to be ready
  ansible.builtin.command:
    cmd: kubectl get nodes --no-headers
  environment:
    KUBECONFIG: /root/.kube/config
  register: apiserver_ready
  until: apiserver_ready.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Install Calico CNI
  ansible.builtin.command:
    cmd: kubectl apply --validate=false -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.0/manifests/calico.yaml
  environment:
    KUBECONFIG: /root/.kube/config
  register: calico_apply
  changed_when: "'created' in calico_apply.stdout or 'configured' in calico_apply.stdout"

- name: Wait for Calico pods to be Running
  ansible.builtin.command:
    cmd: kubectl get pods -n kube-system -l k8s-app=calico-node --no-headers
  environment:
    KUBECONFIG: /root/.kube/config
  register: calico_pods
  until: calico_pods.stdout_lines | select('search', 'Running') | list | length > 0
  retries: 30
  delay: 10
  changed_when: false
