---
# In Podman privileged containers /lib/modules may not be present.
# Use modprobe directly and ignore errors for built-in modules.

- name: Load overlay kernel module
  ansible.builtin.command:
    cmd: modprobe overlay
  register: modprobe_overlay
  failed_when: false
  changed_when: modprobe_overlay.rc == 0

- name: Load br_netfilter kernel module
  ansible.builtin.command:
    cmd: modprobe br_netfilter
  register: modprobe_br
  failed_when: false
  changed_when: modprobe_br.rc == 0

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: "0644"
