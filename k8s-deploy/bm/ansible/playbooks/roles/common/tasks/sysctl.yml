---
# In Podman privileged containers some sysctl keys may already be set by the host
# or /proc/sys may be partially read-only. Use command + ignore errors.

- name: Write sysctl config file for K8s networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    owner: root
    group: root
    mode: "0644"

- name: Apply sysctl settings
  ansible.builtin.command:
    cmd: sysctl -p /etc/sysctl.d/k8s.conf
  register: sysctl_result
  failed_when: false
  changed_when: sysctl_result.rc == 0

- name: Show sysctl apply result
  ansible.builtin.debug:
    msg: "sysctl apply rc={{ sysctl_result.rc }} — {{ sysctl_result.stderr | default('ok') }}"
  when: sysctl_result.rc != 0
