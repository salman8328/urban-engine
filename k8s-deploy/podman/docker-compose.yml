# 3-node K8s lab using systemd-enabled AlmaLinux 10 containers
# Usage:
#   1. First create the network + build image: ./scripts/setup.sh
#   2. Start containers: podman-compose up -d
#   3. Install K8s prereqs via Ansible: cd ../ansible && ansible-playbook playbooks/site.yml
#   4. Bootstrap cluster via Ansible: ansible-playbook playbooks/k8s-init.yml
#
# DNS: Podman's netavark backend provides container DNS by hostname within k8s-lab network.
# SSH: Each container exposes sshd on a unique host port (2210/2211/2212) for Ansible access.

version: "3.9"

networks:
  k8s-lab:
    external: true  # Created via: podman network create --subnet 10.89.0.0/24 --gateway 10.89.0.1 k8s-lab

services:

  k8s-master:
    build:
      context: .
      dockerfile: Dockerfile
    image: k8s-node:almalinux10
    container_name: k8s-master
    hostname: k8s-master
    networks:
      k8s-lab:
        ipv4_address: 10.89.0.10
    privileged: true
    cgroupns: host
    ports:
      - "2210:22"   # SSH for Ansible → ansible_port: 2210
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /sys/fs/bpf:/sys/fs/bpf:shared
      - k8s-master-data:/var/lib/kubelet
      - k8s-master-containerd:/var/lib/containerd
      - ~/.ssh/id_rsa.pub:/root/.ssh/authorized_keys:ro
    environment:
      - container=podman
    restart: unless-stopped

  k8s-worker1:
    image: k8s-node:almalinux10
    container_name: k8s-worker1
    hostname: k8s-worker1
    networks:
      k8s-lab:
        ipv4_address: 10.89.0.11
    privileged: true
    cgroupns: host
    ports:
      - "2211:22"   # SSH for Ansible → ansible_port: 2211
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /sys/fs/bpf:/sys/fs/bpf:shared
      - k8s-worker1-data:/var/lib/kubelet
      - k8s-worker1-containerd:/var/lib/containerd
      - ~/.ssh/id_rsa.pub:/root/.ssh/authorized_keys:ro
    environment:
      - container=podman
    depends_on:
      - k8s-master
    restart: unless-stopped

  k8s-worker2:
    image: k8s-node:almalinux10
    container_name: k8s-worker2
    hostname: k8s-worker2
    networks:
      k8s-lab:
        ipv4_address: 10.89.0.12
    privileged: true
    cgroupns: host
    ports:
      - "2212:22"   # SSH for Ansible → ansible_port: 2212
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /sys/fs/bpf:/sys/fs/bpf:shared
      - k8s-worker2-data:/var/lib/kubelet
      - k8s-worker2-containerd:/var/lib/containerd
      - ~/.ssh/id_rsa.pub:/root/.ssh/authorized_keys:ro
    environment:
      - container=podman
    depends_on:
      - k8s-master
    restart: unless-stopped

volumes:
  k8s-master-data:
  k8s-master-containerd:
  k8s-worker1-data:
  k8s-worker1-containerd:
  k8s-worker2-data:
  k8s-worker2-containerd:
